# Checks whose result can change without a change to the repository, such as an advisory
# published against a locked dependency (OPS-12).
name: scheduled

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # just first, then the tools its tasks need, at the versions the justfile pins (OPS-13).
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.59.0
      - id: tools
        run: echo "tools=$(just ci-tools)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: ${{ steps.tools.outputs.tools }}
      - run: just setup
      - run: just deny
