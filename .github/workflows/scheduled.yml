# Checks whose result can change without a change to the repository, such as an advisory
# published against a locked dependency or a published image, and the registry's upkeep (OPS-12).
name: scheduled

on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every day.
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # just first, then the tools its tasks need, at the versions the justfile pins (OPS-13).
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@1.59.0
      - id: tools
        run: echo "tools=$(just ci-tools)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: ${{ steps.tools.outputs.tools }}
      - run: just setup
      - run: just deny

  # Every Monday: the published images, scanned again (SEC-13).
  images:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 4 * * 1'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@1.59.0
      - run: just env
      - run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
      - run: just image-rescan "$REPOSITORY"
        env:
          REPOSITORY: ${{ github.repository }}

  # Every Monday: the registry's upkeep, which keeps the tags as long as
  # docs/operations/release.md says. The action keeps each platform's image of an index it keeps.
  prune:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 4 * * 1'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: registry
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@1.59.0
      - id: image
        run: echo "package=$(just image-package "$REPOSITORY")" >> "$GITHUB_OUTPUT"
        env:
          REPOSITORY: ${{ github.repository }}
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ steps.image.outputs.package }}
          delete-tags: "*-rc.*"
          older-than: 90 days
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ steps.image.outputs.package }}
          delete-tags: sha-*
          delete-untagged: true
          delete-orphaned-images: true
          older-than: 30 days
          validate: true
