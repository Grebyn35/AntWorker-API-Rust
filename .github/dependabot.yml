# Weekly pull requests that update the pins (OPS-13): the crates, the actions, the images in the
# Dockerfiles and in the compose files, and the toolchain. Each runs the whole pipeline.
# docs/operations/ci.md lists the pins updated by hand.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # Their releases depend on each other, so they move together.
      opentelemetry:
        patterns: ["opentelemetry*", "tracing-opentelemetry", "json-subscriber"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    # The API's image, and the reference deployment's Postgres.
    directories: [/, /deploy/postgres]
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    # Development's services and the tasks' tools, and the reference deployment's, with the
    # services and tools both share.
    directories: [/, /deploy, /deploy/observability, /deploy/tools]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
