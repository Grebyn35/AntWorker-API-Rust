[package]
name = "platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["matched-path"] }
http-body-util.workspace = true
json-subscriber.workspace = true
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry-otlp.workspace = true
# The names of semantic conventions still in development, such as the SDK's own metrics.
opentelemetry-semantic-conventions = { workspace = true, features = ["semconv_experimental"] }
opentelemetry_sdk.workspace = true
percent-encoding.workspace = true
postgres-protocol.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tower = { workspace = true, features = ["limit", "load-shed", "timeout"] }
tower-http = { workspace = true, features = ["catch-panic", "set-header"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true

[features]
# Raw database connections, and telemetry kept in memory, for the test support (TEST-06). Only the
# tests enable it.
test-support = ["opentelemetry_sdk/testing"]

[lints]
workspace = true
