[package]
name = "platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["matched-path"] }
base64.workspace = true
getrandom.workspace = true
hmac.workspace = true
http-body-util.workspace = true
ipnet.workspace = true
json-subscriber.workspace = true
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry-otlp.workspace = true
# The stand-in collector of the test support decodes what the API exports.
opentelemetry-proto = { workspace = true, optional = true }
# The names of semantic conventions still in development, such as the SDK's own metrics.
opentelemetry-semantic-conventions = { workspace = true, features = ["semconv_experimental"] }
opentelemetry_sdk.workspace = true
percent-encoding.workspace = true
postgres-protocol.workspace = true
prost = { workspace = true, optional = true }
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tower = { workspace = true, features = ["limit", "load-shed", "timeout"] }
tower-http = { workspace = true, features = ["catch-panic", "set-header"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
utoipa = { workspace = true, features = ["uuid"] }
utoipa-axum.workspace = true
uuid.workspace = true

[features]
# Raw database connections, telemetry kept in memory, and a stand-in collector, for the test
# support (TEST-05, TEST-06). Only the tests enable it.
test-support = ["opentelemetry_sdk/testing", "dep:opentelemetry-proto", "dep:prost"]

[lints]
workspace = true
