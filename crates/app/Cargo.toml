[package]
name = "app"
version = "0.1.0-rc.11"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "antworker-api"
path = "src/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["e2e"]

[features]
# Compiles the end-to-end tests, which need a built image (TEST-03). `just e2e` turns it on, and
# so does `just lint`, which lints every feature.
e2e = []
# Compiles the entry points that only the tests call, such as the permission matrix's, which this
# crate's own dev-dependency turns on for its tests (CODE-15, TEST-05).
test-support = []

[dependencies]
platform.workspace = true
argon2.workspace = true
askama.workspace = true
axum.workspace = true
bytes.workspace = true # part: files
clap.workspace = true
futures-util.workspace = true
ipnet.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
# seed sends the API's router its requests in process.
tower.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true

# The allocator of the image's static binary, for the reason architecture.md gives in §10.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
app = { path = ".", features = ["test-support"] }
platform = { workspace = true, features = ["test-support"] }
# The fixture routes parse a query.
axum = { workspace = true, features = ["query"] }
dotenvy.workspace = true
http.workspace = true
http-body-util.workspace = true
# The test support checks every response against the OpenAPI document (API-17).
jsonschema.workspace = true
# The tests read what the stand-in collector decoded.
opentelemetry-proto.workspace = true
# The end-to-end tests send requests over HTTPS to the reference deployment's proxy, trusting the
# authority that signs its certificates in the tests.
reqwest.workspace = true
rustls.workspace = true
# A test of the settings reads the reference deployment's Compose file (OPS-02).
serde-saphyr.workspace = true
serde_json.workspace = true
# The test support shares the template database through tokio::sync::OnceCell, its stand-in
# servers read and write their sockets, the tests of timeouts pause tokio's time, and a test of
# the development settings reads their files.
tokio = { workspace = true, features = ["fs", "io-util", "sync", "test-util"] }
url.workspace = true

[lints]
workspace = true
