[package]
name = "app"
version = "0.1.0-rc.7"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "antworker-api"
path = "src/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["e2e"]

[features]
# Compiles the end-to-end tests, which need a built image (TEST-04). `just e2e` turns it on, and
# so does `just lint`, which lints every feature.
e2e = []

[dependencies]
platform.workspace = true
axum.workspace = true
clap.workspace = true
serde.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

# The allocator of the image's static binary, for the reason architecture.md gives in §10.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
platform = { workspace = true, features = ["test-support"] }
# The fixture routes parse a query.
axum = { workspace = true, features = ["query"] }
dotenvy.workspace = true
http.workspace = true
http-body-util.workspace = true
# The test support checks every response against the OpenAPI document (API-17).
jsonschema.workspace = true
# The tests read what the stand-in collector decoded.
opentelemetry-proto.workspace = true
# The end-to-end tests send requests over HTTPS to the reference deployment's proxy, trusting the
# authority that signs its certificates in the tests.
reqwest.workspace = true
rustls.workspace = true
serde_json.workspace = true
# The test support shares the template database through tokio::sync::OnceCell, and the tests
# of timeouts pause tokio's time.
tokio = { workspace = true, features = ["sync", "test-util"] }
tower.workspace = true
url.workspace = true

[lints]
workspace = true
