<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your {{ email.product }} verification code</title>
</head>
<body style="margin: 0; padding: 24px; font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.5; color: #1f2328; background: #ffffff;">
<p style="margin: 0 0 16px;">Enter this code in {{ email.product }} to verify your email address:</p>
<p style="margin: 0 0 16px; font-size: 28px; font-weight: 600; letter-spacing: 4px;">{{ email.code }}</p>
<p style="margin: 0 0 16px;">It works once, for 10 minutes, and a newer code replaces it.</p>
<p style="margin: 0;">If you didn't create a {{ email.product }} account with {{ email.to }}, ignore this email.</p>
</body>
</html>
