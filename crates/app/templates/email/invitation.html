<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ email.inviter }} invited you to {{ email.workspace }} on {{ email.product }}</title>
</head>
<body style="margin: 0; padding: 24px; font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.5; color: #1f2328; background: #ffffff;">
<p style="margin: 0 0 16px;"><strong>{{ email.inviter }}</strong> invited you to join the workspace <strong>{{ email.workspace }}</strong> on {{ email.product }}, as {{ email.role }}. The invitation expires in {{ email.expiry }}.</p>
<p style="margin: 0;">To accept it, sign in to {{ email.product }} with {{ email.to }}, or create an account with that address.</p>
</body>
</html>
