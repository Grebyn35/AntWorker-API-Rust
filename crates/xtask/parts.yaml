# Each run keeps, with `just keep`, every part that it doesn't remove, on a copy of the repository
# of its own, then runs `just checks` on the copy: one that keeps every part, one for each
# workspace shape (architecture §5), one for each part that no shape's run removes alone, and one
# that removes every part that one fork can remove at once.
# The run whose task is `remove` removes its parts with `just remove` instead, which keeps
# `removal`, as a fork that has yet to choose its parts does.
# A run whose parts are all removed already is skipped.
runs:
  # A product that keeps every part, as the template does.
  - name: every_part
    parts:
      - removal
  # part: workspace_creation
  # The personal shape: users create workspaces, and nobody joins them.
  - name: personal
    parts:
      - invitations # part: invitations
      - workspace_setup # part: workspace_setup
  # part: workspace_setup
  # part: invitations
  # The teams shape: users create workspaces, whose members invite others, and no operator sets
  # one up.
  - name: teams
    parts:
      - workspace_setup
  # The one organization shape: an operator sets each workspace up, whose members invite others,
  # and no user creates one.
  - name: organization
    parts:
      - workspace_creation
  # end part: invitations
  # end part: workspace_setup
  # end part: workspace_creation
  # part: superadmins
  # part: invitations
  # The provisioned shape: a superadmin creates each workspace, whose members invite others, and
  # no other part creates one.
  - name: provisioned
    parts:
      - workspace_creation # part: workspace_creation
      - workspace_setup # part: workspace_setup
  # end part: invitations
  # end part: superadmins
  # part: invitations
  # A product whose workspaces nobody joins, so nobody is invited to one.
  - name: invitations
    parts:
      - invitations
  # end part: invitations
  # part: files
  # A product without uploads.
  - name: files
    parts:
      - files
  # end part: files
  # part: superadmins
  # A product without superadmins.
  - name: superadmins
    parts:
      - superadmins
  # end part: superadmins
  # part: github
  # A product without GitHub's sign-in.
  - name: github
    parts:
      - github
  # end part: github
  # part: google
  # A product without Google's sign-in.
  - name: google
    parts:
      - google
  # end part: google
  # part: openid_connect
  # A product without a sign-in through a provider that the deployment names.
  - name: openid_connect
    parts:
      - openid_connect
  # end part: openid_connect
  # part: client_telemetry
  # A product whose clients send no telemetry.
  - name: client_telemetry
    parts:
      - client_telemetry
  # end part: client_telemetry
  # The fewest parts a fork keeps: every part that one fork can remove, so the lines that several
  # parts mark are removed together too. It keeps one part that creates workspaces, since every
  # shape keeps one.
  - name: minimal
    parts:
      - invitations # part: invitations
      # part: workspace_creation
      - workspace_setup # part: workspace_setup
      # end part: workspace_creation
      # part: files
      - files
      # end part: files
      # part: superadmins
      - superadmins
      # end part: superadmins
      # part: github
      - github
      # end part: github
      # part: google
      - google
      # end part: google
      # part: openid_connect
      - openid_connect
      # end part: openid_connect
      # part: client_telemetry
      - client_telemetry
      # end part: client_telemetry
  # What `just remove` leaves of the same parts: `removal` stays, with the markers of the parts
  # kept and the checks that read them.
  - name: removed
    task: remove
    parts:
      - invitations # part: invitations
      # part: workspace_creation
      - workspace_setup # part: workspace_setup
      # end part: workspace_creation
      # part: files
      - files
      # end part: files
      # part: superadmins
      - superadmins
      # end part: superadmins
      # part: github
      - github
      # end part: github
      # part: google
      - google
      # end part: google
      # part: openid_connect
      - openid_connect
      # end part: openid_connect
      # part: client_telemetry
      - client_telemetry
      # end part: client_telemetry
