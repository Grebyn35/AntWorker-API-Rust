# The optional parts that `just remove` and `just keep` delete (ARCH-07), and the runs of
# `check-removable`.
#
# `removal` holds what makes the other parts removable: this file, the tooling that reads it, and
# the lines that carry its marker (ARCH-07). `just keep` removes it, with the parts that a
# fork doesn't keep, then takes the other parts' markers out, and `just remove` never removes it.
# A part that creates workspaces says so, since a fork keeps one at least.
#
# Each part names the files it owns whole: files, or directories with every file under them. A
# module part also names its module, whose migrations, those named
# `<timestamp>_<module>_<description>.sql`, are its own. Its words are what no file may still hold
# once it is removed, compared without regard to case: among them the name of each workspace
# shape that needs the part, so a line that names a shape carries the marker of each part that
# gives it. A part's entry carries its marker, so removing it removes the entry too.
parts:
  - name: removal
    paths:
      - crates/xtask/parts.yaml
      - crates/xtask/src/parts
    words:
      - optional part
      - arch-07
      - "`just remove`"
      - "just remove "
      - just keep
      - check-parts
      - check-removable
      - check_removable
      - parts.yaml
      - part's marker
