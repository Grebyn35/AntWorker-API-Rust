# The optional parts that `just remove` deletes (ARCH-07), and the runs of `check-removable`.
#
# Each part names the files it owns whole: files, or directories with every file under them. A
# module part also names its module, whose migrations, those named
# `<timestamp>_<module>_<description>.sql`, are its own. Its words are what no file may still hold
# once it is removed, compared without regard to case. A part's entry carries its marker, so
# removing it removes the entry too.
parts:
  # part: invitations
  - name: invitations
    module: invitations
    paths:
      - crates/app/src/modules/invitations
      - crates/app/templates/invitations
      - crates/app/tests/integration/invitations.rs
      - crates/app/tests/integration/support/invitations.rs
      - crates/app/tests/load/streams.js
      - crates/xtask/src/load/streams
      - docs/spec/invitations.md
    words:
      - invit
  # end part: invitations
  # part: files
  - name: files
    module: files
    paths:
      - crates/app/src/modules/accounts/repo/avatar.rs
      - crates/app/src/modules/accounts/routes/avatar.rs
      - crates/app/src/modules/accounts/service/avatar.rs
      - crates/app/src/modules/files
      - crates/app/src/modules/workspaces/repo/picture.rs
      - crates/app/src/modules/workspaces/routes/picture.rs
      - crates/app/src/modules/workspaces/service/picture.rs
      - crates/app/tests/e2e/files.rs
      - crates/app/tests/integration/files
      - crates/app/tests/integration/platform/scanner.rs
      - crates/app/tests/integration/support/bucket.rs
      - crates/app/tests/integration/support/files.rs
      - crates/app/tests/integration/support/scanner.rs
      - crates/platform/src/config/scanner.rs
      - crates/platform/src/config/storage.rs
      - crates/platform/src/http/docs/files.rs
      - crates/platform/src/http/files.rs
      - crates/platform/src/http/signed.rs
      - crates/platform/src/http/upload.rs
      - crates/platform/src/scanner.rs
      - crates/platform/src/signed_urls.rs
      - crates/platform/src/storage
      - deploy/observability/grafana/dashboards/files.json
      - deploy/scanner
      - docs/spec/files.md
    words:
      - avatar_
      - avatar.
      - /avatar
      - clam
      - eicar
      - malware
      - picture_
      - picture.
      - "}/picture"
      - ./picture
      - workspace picture
      - workspace-picture
      - public file
      - signed url
      - signed_url
      - signedurl
      - user file
      - user_file
      - user-file
      - workspace file
      - workspace_file
      - workspace-file
      - files::
      - files-0
      - files_s3
      - files-ca
      - files bucket
      - files.delete
      - files.empty
      - files.find_
      - files.invalid
      - files.not_found
      - files.outcome
      - files.read
      - files.scanner
      - files.storage
      - files.unsupported
      - files.upload
  # end part: files
  # part: github
  - name: github
    paths:
      - crates/app/src/modules/auth/providers/github.rs
      - crates/app/tests/integration/auth/github.rs
    words:
      - github_client
      - github_redirect
      - providers::github
      - providers/github
      - mod github
  # end part: github
  # part: google
  - name: google
    paths:
      - crates/app/src/modules/auth/providers/google.rs
      - crates/app/tests/integration/auth/google.rs
    words:
      - google_
      - providers::google
      - providers/google
      - mod google
  # end part: google
  # part: openid_connect
  - name: openid_connect
    paths:
      - crates/app/src/modules/auth/providers/openid_connect.rs
      - crates/app/tests/integration/auth/openid_connect.rs
    words:
      - openid_connect
  # end part: openid_connect

# Each run removes its parts from a copy of the repository of its own, then runs `just checks` on
# the copy: one for each workspace shape (architecture §5), for each OAuth provider, for
# `client_telemetry`, and for each part that no shape needs, and one that removes every part that
# one fork can remove at once.
# A run whose parts are all removed already is skipped.
runs:
  # The personal shape: users create workspaces, and nobody joins them.
  - name: personal
    parts:
      - invitations # part: invitations
  # part: files
  # A product without uploads.
  - name: files
    parts:
      - files
  # end part: files
  # part: github
  # A product without GitHub's sign-in.
  - name: github
    parts:
      - github
  # end part: github
  # part: google
  # A product without Google's sign-in.
  - name: google
    parts:
      - google
  # end part: google
  # part: openid_connect
  # A product without a sign-in through a provider that the deployment names.
  - name: openid_connect
    parts:
      - openid_connect
  # end part: openid_connect
  # The fewest parts a fork keeps: every part that one fork can remove, so the lines that several
  # parts mark are removed together too. It keeps users creating workspaces, since every shape
  # keeps a part that creates them.
  - name: minimal
    parts:
      - invitations # part: invitations
      # part: files
      - files
      # end part: files
      # part: github
      - github
      # end part: github
      # part: google
      - google
      # end part: google
      # part: openid_connect
      - openid_connect
      # end part: openid_connect
