[workspace]
members = ["crates/platform", "crates/app", "crates/xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
platform = { path = "crates/platform" }

axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
dotenvy = "0.15.7"
http = "1.5.0"
http-body-util = "0.1.5"
percent-encoding = "2.3.2"
postgres-protocol = "0.6.12"
pulldown-cmark = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "tls-rustls-ring-native-roots"] }
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "ansi"] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
