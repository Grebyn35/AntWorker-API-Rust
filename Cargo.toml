[workspace]
members = ["crates/platform", "crates/app", "crates/xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
platform = { path = "crates/platform" }

argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
clap ={ version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
dotenvy = "0.15.7"
getrandom = { version = "0.4.3", default-features = false }
hmac = { version = "0.13.0", default-features = false }
http = "1.5.0"
http-body-util = "0.1.5"
ipnet = { version = "2.12.2", default-features = false, features = ["std"] }
jsonschema ={ version = "0.60.1", default-features = false }
json-subscriber = { version = "0.3.1", default-features = false, features = ["tracing-opentelemetry-0-34"] }
# The SMTP transport on Tokio, with rustls on ring and the system's certificates (SEC-14, D38).
lettre = { version = "0.11.23", default-features = false, features = ["builder", "pool", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-native-certs"] }
mimalloc = { version = "0.1.52", default-features = false }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-appender-tracing = { version = "0.33.1", default-features = false }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs"] }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs"] }
opentelemetry-semantic-conventions = { version = "0.33.1", default-features = false }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs"] }
percent-encoding = "2.3.2"
postgres-protocol = "0.6.12"
prost = { version = "0.14.4", default-features = false, features = ["std"] }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
pulldown-cmark = { version = "0.13.5", default-features = false }
# reqwest's `rustls` feature brings aws-lc-rs, which SEC-14 bans, so the telemetry exporters' client
# takes a rustls configuration built with ring.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8.5"
# `just server-setup` asks for each secret without showing what is typed, which the standard
# library can't do and the workspace's ban on unsafe code keeps xtask from doing itself.
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = { version = "0.11.1", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "tls-rustls-ring-native-roots", "uuid", "time", "json", "ipnet"] }
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-appender = "0.2.5"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "registry"] }
unicode-normalization = { version = "0.1.26", default-features = false, features = ["std"] }
url = "2.5.8"
uuid = { version = "1.29.0", default-features = false, features = ["std", "v4", "serde"] }
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }
utoipa-axum = "0.3.0"

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unused_result_ok = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
