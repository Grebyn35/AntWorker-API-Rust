# The recording rules behind the service-level objectives, and the alerts (OBS-14).
# docs/operations/observability.md states the objectives and how the burn-rate alerts spend their
# budgets. Every alert has a severity, page or ticket, a runbook section in
# docs/operations/runbooks.md, and a test in rules.test.yaml.

groups:
  # With traffic but no 5xx, the ratio is 0 rather than empty.
  - name: slo-availability
    rules:
      - record: job:slo_request_errors:ratio_rate5m
        expr: |
          (sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
            or 0 * sum by (job) (rate(http_server_request_duration_seconds_count[5m])))
          / sum by (job) (rate(http_server_request_duration_seconds_count[5m]))
      - record: job:slo_request_errors:ratio_rate30m
        expr: |
          (sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[30m]))
            or 0 * sum by (job) (rate(http_server_request_duration_seconds_count[30m])))
          / sum by (job) (rate(http_server_request_duration_seconds_count[30m]))
      - record: job:slo_request_errors:ratio_rate1h
        expr: |
          (sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[1h]))
            or 0 * sum by (job) (rate(http_server_request_duration_seconds_count[1h])))
          / sum by (job) (rate(http_server_request_duration_seconds_count[1h]))
      - record: job:slo_request_errors:ratio_rate2h
        expr: |
          (sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[2h]))
            or 0 * sum by (job) (rate(http_server_request_duration_seconds_count[2h])))
          / sum by (job) (rate(http_server_request_duration_seconds_count[2h]))
      - record: job:slo_request_errors:ratio_rate6h
        expr: |
          (sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[6h]))
            or 0 * sum by (job) (rate(http_server_request_duration_seconds_count[6h])))
          / sum by (job) (rate(http_server_request_duration_seconds_count[6h]))
      - record: job:slo_request_errors:ratio_rate1d
        expr: |
          (sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[1d]))
            or 0 * sum by (job) (rate(http_server_request_duration_seconds_count[1d])))
          / sum by (job) (rate(http_server_request_duration_seconds_count[1d]))
      - record: job:slo_request_errors:ratio_rate3d
        expr: |
          (sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[3d]))
            or 0 * sum by (job) (rate(http_server_request_duration_seconds_count[3d])))
          / sum by (job) (rate(http_server_request_duration_seconds_count[3d]))

  # A request is slow when it takes longer than the latency objective, whose bucket holds the
  # requests within it; check-telemetry-config keeps the bucket and the objective the same.
  - name: slo-latency
    rules:
      - record: job:slo_requests_slow:ratio_rate5m
        expr: |
          1 - sum by (job) (rate(http_server_request_duration_seconds_bucket{le="0.5"}[5m]))
          / sum by (job) (rate(http_server_request_duration_seconds_count[5m]))
      - record: job:slo_requests_slow:ratio_rate30m
        expr: |
          1 - sum by (job) (rate(http_server_request_duration_seconds_bucket{le="0.5"}[30m]))
          / sum by (job) (rate(http_server_request_duration_seconds_count[30m]))
      - record: job:slo_requests_slow:ratio_rate1h
        expr: |
          1 - sum by (job) (rate(http_server_request_duration_seconds_bucket{le="0.5"}[1h]))
          / sum by (job) (rate(http_server_request_duration_seconds_count[1h]))
      - record: job:slo_requests_slow:ratio_rate2h
        expr: |
          1 - sum by (job) (rate(http_server_request_duration_seconds_bucket{le="0.5"}[2h]))
          / sum by (job) (rate(http_server_request_duration_seconds_count[2h]))
      - record: job:slo_requests_slow:ratio_rate6h
        expr: |
          1 - sum by (job) (rate(http_server_request_duration_seconds_bucket{le="0.5"}[6h]))
          / sum by (job) (rate(http_server_request_duration_seconds_count[6h]))
      - record: job:slo_requests_slow:ratio_rate1d
        expr: |
          1 - sum by (job) (rate(http_server_request_duration_seconds_bucket{le="0.5"}[1d]))
          / sum by (job) (rate(http_server_request_duration_seconds_count[1d]))
      - record: job:slo_requests_slow:ratio_rate3d
        expr: |
          1 - sum by (job) (rate(http_server_request_duration_seconds_bucket{le="0.5"}[3d]))
          / sum by (job) (rate(http_server_request_duration_seconds_count[3d]))

  - name: alerts
    rules:
      - alert: AvailabilityBudgetBurningFast
        expr: |
          (job:slo_request_errors:ratio_rate1h > 14.4 * 0.001 and job:slo_request_errors:ratio_rate5m > 14.4 * 0.001)
          or (job:slo_request_errors:ratio_rate6h > 6 * 0.001 and job:slo_request_errors:ratio_rate30m > 6 * 0.001)
        for: 2m
        labels:
          severity: page
        annotations:
          summary: The API answers with 5xx fast enough to spend its availability budget within days.
          runbook: docs/operations/runbooks.md#availabilitybudgetburningfast

      - alert: AvailabilityBudgetBurningSlowly
        expr: |
          (job:slo_request_errors:ratio_rate1d > 3 * 0.001 and job:slo_request_errors:ratio_rate2h > 3 * 0.001)
          or (job:slo_request_errors:ratio_rate3d > 0.001 and job:slo_request_errors:ratio_rate6h > 0.001)
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: The API answers with 5xx often enough to spend its availability budget within the month.
          runbook: docs/operations/runbooks.md#availabilitybudgetburningslowly

      - alert: LatencyBudgetBurningFast
        expr: |
          (job:slo_requests_slow:ratio_rate1h > 14.4 * 0.01 and job:slo_requests_slow:ratio_rate5m > 14.4 * 0.01)
          or (job:slo_requests_slow:ratio_rate6h > 6 * 0.01 and job:slo_requests_slow:ratio_rate30m > 6 * 0.01)
        for: 2m
        labels:
          severity: page
        annotations:
          summary: Requests take longer than the latency objective often enough to spend the latency budget within days.
          runbook: docs/operations/runbooks.md#latencybudgetburningfast

      - alert: LatencyBudgetBurningSlowly
        expr: |
          (job:slo_requests_slow:ratio_rate1d > 3 * 0.01 and job:slo_requests_slow:ratio_rate2h > 3 * 0.01)
          or (job:slo_requests_slow:ratio_rate3d > 0.01 and job:slo_requests_slow:ratio_rate6h > 0.01)
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: Requests take longer than the latency objective often enough to spend the latency budget within the month.
          runbook: docs/operations/runbooks.md#latencybudgetburningslowly

      - alert: DatabaseUnreachable
        expr: platform_database_reachable == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: An instance's listener, its own connection to the database, stopped answering its checks.
          runbook: docs/operations/runbooks.md#databaseunreachable

      - alert: StorageUnreachable
        expr: |
          sum(increase(platform_storage_requests_total{storage_outcome="unavailable"}[5m])) > 0
            unless sum(increase(platform_storage_requests_total{storage_outcome=~"ok|not_found|failed"}[5m])) > 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: The bucket of files' bytes answered none of the API's calls for 5 minutes, while some went unanswered.
          runbook: docs/operations/runbooks.md#storageunreachable

      - alert: ScannerUnreachable
        expr: |
          sum(increase(platform_scans_total{scanner_outcome="unavailable"}[5m])) > 0
            unless sum(increase(platform_scans_total{scanner_outcome=~"clean|found|failed"}[5m])) > 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: The malware scanner answered none of the API's scans for 5 minutes, while some went unanswered, so no upload is stored.
          runbook: docs/operations/runbooks.md#scannerunreachable

      - alert: ApiTelemetryMissing
        expr: absent_over_time(platform_database_reachable[2m])
        for: 3m
        labels:
          severity: page
        annotations:
          summary: No instance of the API has exported metrics for five minutes.
          runbook: docs/operations/runbooks.md#apitelemetrymissing

      - alert: TelemetryExportFailing
        expr: |
          sum by (job, instance) (increase(otel_sdk_exporter_span_exported_total{error_type!=""}[10m])) > 0
          or sum by (job, instance) (increase(otel_sdk_exporter_log_exported_total{error_type!=""}[10m])) > 0
          or sum by (job, instance) (increase(otel_sdk_exporter_metric_data_point_exported_total{error_type!=""}[10m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: An instance of the API failed to export spans, log records or metrics in the last 10 minutes.
          runbook: docs/operations/runbooks.md#telemetryexportfailing

      - alert: CollectorDroppingTelemetry
        expr: |
          sum(increase(otelcol_receiver_refused_spans_total[10m])) > 0
          or sum(increase(otelcol_receiver_refused_log_records_total[10m])) > 0
          or sum(increase(otelcol_receiver_refused_metric_points_total[10m])) > 0
          or sum(increase(otelcol_exporter_send_failed_spans_total[10m])) > 0
          or sum(increase(otelcol_exporter_send_failed_log_records_total[10m])) > 0
          or sum(increase(otelcol_exporter_send_failed_metric_points_total[10m])) > 0
          or sum(increase(otelcol_processor_tail_sampling_sampling_trace_dropped_too_early_total[10m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: The collector refused, failed to pass on, or dropped before deciding, telemetry in the last 10 minutes.
          runbook: docs/operations/runbooks.md#collectordroppingtelemetry

      # Events (OBS-14, the platform spec's "Events and the real-time hub"). The lag is recorded
      # only for events that a hub loaded, so a hub that hears nothing is DatabaseUnreachable's.
      - alert: EventsDelayed
        expr: histogram_quantile(0.99, sum by (le) (rate(platform_event_delivery_lag_seconds_bucket[10m]))) > 5
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: Events have reached their streams more than 5 seconds after they committed, at the 99th percentile, for 10 minutes.
          runbook: docs/operations/runbooks.md#eventsdelayed

      # A hub that hears of events but can't load them records no lag, so EventsDelayed never
      # sees it; the events it owes stay above 0 (PLATFORM-035).
      - alert: EventsStalled
        expr: max by (instance) (platform_events_unloaded) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: A replica's hub has owed its streams events it couldn't load for 5 minutes.
          runbook: docs/operations/runbooks.md#eventsstalled

      # Background jobs (OBS-14, the platform spec's Jobs). A series of platform_job_runs_total
      # appears with its first run, so a window counts a series that existed at its start by its
      # increase, and a newer one by its value, which increase() would miss the first of.
      - alert: JobsDelayed
        expr: max(platform_job_delay_seconds) > 600
        for: 5m
        labels:
          severity: page
        annotations:
          summary: A runnable job has waited more than 10 minutes past its time to run, for 5 minutes.
          runbook: docs/operations/runbooks.md#jobsdelayed

      - alert: JobsDeadLettered
        expr: |
          sum by (job_kind) (
            (increase(platform_job_runs_total{job_outcome="dead_lettered"}[1h])
              and platform_job_runs_total{job_outcome="dead_lettered"} offset 1h)
            or (platform_job_runs_total{job_outcome="dead_lettered"}
              unless platform_job_runs_total{job_outcome="dead_lettered"} offset 1h)
          ) > 0
        labels:
          severity: ticket
        annotations:
          summary: A job moved to the dead-letter state in the last hour.
          runbook: docs/operations/runbooks.md#jobsdeadlettered

      - alert: PeriodicJobFailing
        # Each sum counts a job's runs of one outcome within the window, those of a series that
        # began within it included, which `increase` alone leaves out. The second condition is a
        # daily job's, whose runs are a day apart: its window holds the last two runs, with an
        # hour to spare, so it holds while each run fails.
        expr: |
          sum by (job_kind) (
            (increase(platform_job_runs_total{job_outcome="failed"}[3h])
              and platform_job_runs_total{job_outcome="failed"} offset 3h)
            or (platform_job_runs_total{job_outcome="failed"}
              unless platform_job_runs_total{job_outcome="failed"} offset 3h)
          ) >= 2
          or (
            sum by (job_kind) (
              (increase(platform_job_runs_total{job_outcome="failed"}[49h])
                and platform_job_runs_total{job_outcome="failed"} offset 49h)
              or (platform_job_runs_total{job_outcome="failed"}
                unless platform_job_runs_total{job_outcome="failed"} offset 49h)
            ) >= 2
            unless sum by (job_kind) (
              (increase(platform_job_runs_total{job_outcome="succeeded"}[49h])
                and platform_job_runs_total{job_outcome="succeeded"} offset 49h)
              or (platform_job_runs_total{job_outcome="succeeded"}
                unless platform_job_runs_total{job_outcome="succeeded"} offset 49h)
            ) > 0
          )
        labels:
          severity: ticket
        annotations:
          summary: A periodic job failed at least twice within 3 hours, or twice within 49 hours with no run that succeeded.
          runbook: docs/operations/runbooks.md#periodicjobfailing

      # The bundled database's backups (OBS-14): the times of the status files that its archiving
      # of the write-ahead log and its base backups set, which a managed database lacks.
      - alert: BackupArchivingFailing
        expr: |
          max(file_mtime_seconds{file_name="archive-failed"})
          > (max(file_mtime_seconds{file_name="archived"}) or vector(0))
        for: 5m
        labels:
          severity: page
        annotations:
          summary: The bundled database's last archive of its write-ahead log failed, more recently than one succeeded, for five minutes.
          runbook: docs/operations/runbooks.md#backuparchivingfailing

      - alert: BaseBackupTooOld
        expr: time() - max(file_mtime_seconds{file_name="backup-completed"}) > 26 * 3600
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: The bundled database's newest base backup completed more than 26 hours ago, though one runs every day.
          runbook: docs/operations/runbooks.md#basebackuptooold

      - alert: ScannerSignaturesOutdated
        expr: time() - max(file_mtime_seconds{file_name=~"daily.c[lv]d"}) > 2 * 86400
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: The malware scanner's daily signatures are more than 2 days old, though ClamAV publishes new ones several times a day.
          runbook: docs/operations/runbooks.md#scannersignaturesoutdated

      - alert: ObservabilityServiceDown
        expr: up{job=~"collector|loki|tempo|alertmanager"} == 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: Prometheus can't reach a service of the observability stack.
          runbook: docs/operations/runbooks.md#observabilityservicedown

      # The server's disks and memory (OBS-14), from the collector's host metrics. A disk alerts
      # only while it fills, so one that stays nearly full, such as a small boot partition, doesn't.
      - alert: DiskFillingUp
        expr: |
          max by (mountpoint) (system_filesystem_utilization_ratio{mode="rw"}) > 0.85
          and on (mountpoint)
          max by (mountpoint) (predict_linear(system_filesystem_usage_bytes{mode="rw", state="free"}[6h], 24 * 3600)) < 0
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: A disk of the server is more than 85% full, and at the rate of the last 6 hours fills within a day.
          runbook: docs/operations/runbooks.md#diskfillingup

      - alert: DiskFull
        expr: |
          max by (mountpoint) (system_filesystem_utilization_ratio{mode="rw"}) > 0.95
          and on (mountpoint)
          max by (mountpoint) (predict_linear(system_filesystem_usage_bytes{mode="rw", state="free"}[1h], 4 * 3600)) < 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: A disk of the server is more than 95% full, and at the rate of the last hour fills within 4 hours.
          runbook: docs/operations/runbooks.md#diskfull

      - alert: MemoryRunningLow
        expr: min(system_linux_memory_available_bytes / system_memory_limit_bytes) < 0.1
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: Less than 10% of the server's memory has been available for 15 minutes.
          runbook: docs/operations/runbooks.md#memoryrunninglow
