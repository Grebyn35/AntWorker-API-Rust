# Prometheus: it stores the API's metrics, which the collector writes through Prometheus's OTLP
# receiver, scrapes the observability stack's own, and evaluates the rules in rules.yaml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

# OTLP metrics keep the default translation to Prometheus names: dots become underscores, and the
# unit and type add their suffixes, so http.server.request.duration becomes
# http_server_request_duration_seconds. service.name becomes the job label, and
# service.instance.id the instance label. file.name, the name of a backup status file, tells the
# backups' series apart.
otlp:
  promote_resource_attributes:
    - deployment.environment.name
    - file.name

storage:
  tsdb:
    # The collector batches, so samples of one series can arrive out of order.
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: collector
    static_configs:
      - targets: [collector:8888]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
