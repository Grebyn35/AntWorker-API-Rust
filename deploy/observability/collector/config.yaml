# The OpenTelemetry Collector: it receives the API's spans, log records and metrics over
# OTLP/HTTP, keeps the traces that tail sampling selects (OBS-08), and passes each signal to its
# store. docs/operations/observability.md describes the pipelines.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  # The times of the bundled database's backup status files, which its pgBackRest wrapper and
  # its backup schedule set: when an archive of the write-ahead log last succeeded and last
  # failed, and when a base backup last completed. The alerts on backups read them (OBS-14). In
  # development, and with a managed database, the directory holds no file.
  file_stats/backups:
    include: /var/lib/backup-status/*
    collection_interval: 60s
    metrics:
      file.size:
        enabled: false

  # The host's CPU, memory and filesystems, read from its filesystem mounted at /hostfs: the
  # server's, or in development the machine that runs Docker. The alerts on a server whose disk
  # fills or whose memory runs low read them (OBS-14). The filesystems leave out those of the
  # kernel and of containers, which hold nothing a disk fills with.
  host_metrics:
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      cpu: {}
      memory:
        metrics:
          system.memory.limit:
            enabled: true
          system.linux.memory.available:
            enabled: true
      filesystem:
        exclude_fs_types:
          fs_types: [autofs, binfmt_misc, bpf, cgroup, cgroup2, configfs, debugfs, devpts, devtmpfs, fusectl, hugetlbfs, iso9660, mqueue, nsfs, overlay, proc, pstore, rpc_pipefs, securityfs, squashfs, sysfs, tmpfs, tracefs]
          match_type: strict
        metrics:
          system.filesystem.utilization:
            enabled: true

processors:
  # Refuses data before the collector runs out of memory, so an overload is counted as refused
  # instead of ending the process.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  # A trace is decided once its spans have had time to arrive: longer than the request timeout
  # of 10 seconds, plus the export delay of 1 second, the API's and the proxy's.
  tail_sampling:
    decision_wait: 15s
    num_traces: 50000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: responses-400-and-above
        type: numeric_attribute
        numeric_attribute:
          key: http.response.status_code
          min_value: 400
      # The latency objective, which the alerts and the latency dashboard share
      # (check-telemetry-config).
      - name: slower-than-the-latency-objective
        type: latency
        latency:
          threshold_ms: 500
      - name: share-of-the-rest
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
  batch: {}

exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp

service:
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                # A counter's name ends in _total, as a managed backend names the counters it
                # receives over OTLP, so the self-hosted stack and a managed one read the same
                # names, and no other suffix names a unit.
                without_type_suffix: false
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp_http/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
    metrics:
      receivers: [otlp, file_stats/backups, host_metrics]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/prometheus]
