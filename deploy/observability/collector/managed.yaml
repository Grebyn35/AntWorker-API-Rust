# The collector with a managed backend in place of the self-hosted stack (D42). The collector
# merges this file over config.yaml and proxy.yaml, so it keeps the receivers and the processors,
# tail sampling among them (OBS-08). It adds what the self-hosted stack's Prometheus does, scraping the
# collector's own metrics and turning resource attributes into labels, and sends every signal to
# the backend's OTLP endpoint, which MANAGED_OTLP_ENDPOINT names, signed in as MANAGED_OTLP_USER
# with the token in the secret file managed_otlp_token. docs/operations/observability.md describes the path,
# for a backend such as Grafana Cloud.
# It comes after clients.yaml too: it sends the two pipelines of clients' spans and log records to the backend, and the series that the third adds up from their metrics. # part: client_telemetry

extensions:
  basicauth/managed:
    client_auth:
      username: ${env:MANAGED_OTLP_USER}
      password: ${file:/run/secrets/managed_otlp_token}

receivers:
  # The collector's own metrics, which the self-hosted Prometheus scrapes, for the alerts on
  # telemetry that is lost (OBS-14).
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: collector
          scrape_interval: 15s
          static_configs:
            - targets: [127.0.0.1:8888]
  # part: client_telemetry
  # The series that clients.yaml adds up from the metrics of users' clients, which the
  # self-hosted Prometheus scrapes, each under its client's service.name.
  prometheus/clients:
    config:
      scrape_configs:
        - job_name: clients
          scrape_interval: 15s
          honor_labels: true
          static_configs:
            - targets: [127.0.0.1:9464]
  # end part: client_telemetry

processors:
  # A backend keeps resource attributes apart from a series' labels, while the self-hosted
  # Prometheus promotes these two, which the dashboards and the rules read.
  transform/labels:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["deployment.environment.name"], resource.attributes["deployment.environment.name"]) where resource.attributes["deployment.environment.name"] != nil
          - set(attributes["file.name"], resource.attributes["file.name"]) where resource.attributes["file.name"] != nil

exporters:
  otlp_http/managed:
    endpoint: ${env:MANAGED_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/managed
    # Empty, the operating system's certificate authorities (OPS-17).
    tls:
      ca_file: ${env:MANAGED_OTLP_CA_FILE}
  # part: client_telemetry
  # The telemetry of users' clients leaves through an exporter of its own, as clients.yaml's
  # does, so nothing of theirs waits in the queue of the API's telemetry.
  otlp_http/managed_clients:
    endpoint: ${env:MANAGED_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/managed
    tls:
      ca_file: ${env:MANAGED_OTLP_CA_FILE}
  # end part: client_telemetry

service:
  # A list replaces an earlier file's, so this one names proxy.yaml's extension too.
  extensions: [basicauth/managed, file_storage/proxy]
  pipelines:
    traces:
      exporters: [otlp_http/managed]
    logs:
      exporters: [otlp_http/managed]
    metrics:
      receivers:
        - otlp
        - file_stats/backups
        # part: files
        - file_stats/scanner
        # end part: files
        - host_metrics
        - prometheus/collector
      processors: [memory_limiter, transform/labels, batch]
      exporters: [otlp_http/managed]
    # part: client_telemetry
    traces/clients:
      exporters: [otlp_http/managed_clients]
    logs/clients:
      exporters: [otlp_http/managed_clients]
    metrics/clients_series:
      receivers: [prometheus/clients]
      processors: [memory_limiter/clients, batch]
      exporters: [otlp_http/managed_clients]
    # end part: client_telemetry
