# Tempo: it stores the traces the collector keeps, and answers searches in TraceQL.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# The traces' retention, 14 days, as Loki keeps the logs. The backend worker deletes older blocks.
backend_worker:
  compaction:
    block_retention: 336h

usage_report:
  reporting_enabled: false
