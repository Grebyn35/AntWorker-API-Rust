# The metrics that the dashboards and alerts read and that other parts of the stack produce, by
# their names in Prometheus. check-metrics fails on a query of a metric that neither the API's
# declarations nor this list holds, and on a metric here that nothing reads (OBS-12).

metrics:
  - name: up
    kind: gauge
    producer: Prometheus
    description: 1 while Prometheus scrapes the target, 0 otherwise.
  - name: system_filesystem_utilization_ratio
    kind: gauge
    producer: the collector's host_metrics receiver
    description: The share of a filesystem of the host that is in use, by mountpoint and mode.
  - name: system_filesystem_usage_bytes
    kind: gauge
    producer: the collector's host_metrics receiver
    description: The bytes of a filesystem of the host, by mountpoint, mode and state, such as free.
  - name: system_linux_memory_available_bytes
    kind: gauge
    producer: the collector's host_metrics receiver
    description: The memory of the host that is available to processes without swapping.
  - name: system_memory_limit_bytes
    kind: gauge
    producer: the collector's host_metrics receiver
    description: All the memory of the host.
  - name: system_cpu_time_seconds_total
    kind: counter
    producer: the collector's host_metrics receiver
    description: The time the host's CPUs spent, by cpu and state, such as idle.
  - name: file_mtime_seconds
    kind: gauge
    producer: the collector's filestats receiver
    description: When a backup status file was last changed, in seconds since the Unix epoch, by file_name.
  - name: otelcol_receiver_refused_spans_total
    kind: counter
    producer: the collector
    description: Spans the collector refused, such as at its memory limit.
  - name: otelcol_receiver_refused_log_records_total
    kind: counter
    producer: the collector
    description: Log records the collector refused.
  - name: otelcol_receiver_refused_metric_points_total
    kind: counter
    producer: the collector
    description: Metric data points the collector refused.
  - name: otelcol_exporter_send_failed_spans_total
    kind: counter
    producer: the collector
    description: Spans the collector failed to send to Tempo.
  - name: otelcol_exporter_send_failed_log_records_total
    kind: counter
    producer: the collector
    description: Log records the collector failed to send to Loki.
  - name: otelcol_exporter_send_failed_metric_points_total
    kind: counter
    producer: the collector
    description: Metric data points the collector failed to send to Prometheus.
  - name: otelcol_processor_tail_sampling_sampling_trace_dropped_too_early_total
    kind: counter
    producer: the collector
    description: Traces tail sampling dropped before deciding them, because it held too many.
  - name: otelcol_processor_tail_sampling_sampling_traces_on_memory
    kind: gauge
    producer: the collector
    description: The traces tail sampling holds while it waits to decide them.
  - name: otelcol_processor_tail_sampling_count_traces_sampled_total
    kind: counter
    producer: the collector
    description: Traces each sampling policy decided, by the policy and whether it kept them.
