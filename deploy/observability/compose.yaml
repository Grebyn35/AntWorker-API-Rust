# The observability stack's services as development and the reference deployment share them
# (D19): their images, commands and configuration files. compose.yaml at the root extends them for
# a developer's machine, and deploy/compose.yaml for a server; each adds what differs there, such
# as published ports and Grafana's sign-in. docs/operations/observability.md describes the stack.
#
# Each service mounts its configuration's directory, not its files: a deploy installs a release's
# files, and a mounted file would go on showing the one it replaced.

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command:
      - --config=/etc/collector/config.yaml
      # part: client_telemetry
      - --config=/etc/collector/clients.yaml
      # end part: client_telemetry
    volumes:
      - ./collector:/etc/collector:ro
      # The host's filesystem, read-only, from which the collector reads the host's CPU, memory and
      # disks.
      - /:/hostfs:ro

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-otlp-receiver
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager:/alertmanager

  loki:
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki:/etc/loki:ro
      - loki:/loki

  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-target=all", "-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo:/etc/tempo:ro
      - tempo:/var/tempo

  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    environment:
      # Grafana reaches no other system: it reports no usage, checks for no update, fetches no
      # plugin beside those its image holds, nor the key that signs plugins, and shows no picture
      # from Gravatar, no news and no snapshot service.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      # What a browser loads for Grafana's pages, and which pages may frame them: Grafana's own
      # template, without the hosts of Grafana Labs and of map tiles, which no dashboard here
      # loads, and with `frame-ancestors`, so no page frames Grafana (SEC-12). A panel that loads
      # from another host needs the host here. Grafana fills in the nonce and its own address.
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY_TEMPLATE: >-
        script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $$NONCE;
        object-src 'none';
        font-src 'self';
        style-src 'self' 'unsafe-inline' blob:;
        img-src 'self' data: blob:;
        base-uri 'self';
        connect-src 'self' ws://$$ROOT_PATH wss://$$ROOT_PATH;
        manifest-src 'self';
        media-src 'none';
        form-action 'self';
        frame-ancestors 'none';
      GF_SECURITY_X_CONTENT_TYPE_OPTIONS: "true"
      # SQLite's write-ahead log, with which Grafana's database waits less on the disk, most of all
      # in the first start, which migrates it one step at a time.
      GF_DATABASE_WAL: "true"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    # Healthy once Grafana answers, which takes it some seconds after it starts, so that waiting
    # for the stack waits for it. While it starts, Grafana is checked every second, so the wait ends
    # a second after it answers.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s
      start_interval: 1s

volumes:
  prometheus:
  alertmanager:
  loki:
  tempo:
  grafana:
