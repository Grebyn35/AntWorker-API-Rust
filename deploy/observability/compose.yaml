# The observability stack's services as development and the reference deployment share them
# (D19): their images, commands and configuration files. compose.yaml at the root extends them for
# a developer's machine, and deploy/compose.yaml for a server; each adds what differs there, such
# as published ports and Grafana's sign-in. docs/operations/observability.md describes the stack.
#
# Each service mounts its configuration's directory, not its files: a deploy installs a release's
# files, and a mounted file would go on showing the one it replaced.

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    command: ["--config=/etc/collector/config.yaml"]
    volumes:
      - ./collector:/etc/collector:ro
      # The host's filesystem, read-only, from which the collector reads the host's CPU, memory and
      # disks.
      - /:/hostfs:ro

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-otlp-receiver
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager:/alertmanager

  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki:/etc/loki:ro
      - loki:/loki

  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-target=all", "-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo:/etc/tempo:ro
      - tempo:/var/tempo

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # SQLite's write-ahead log, with which Grafana's database waits less on the disk, most of all
      # in the first start, which migrates it one step at a time.
      GF_DATABASE_WAL: "true"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    # Healthy once Grafana answers, which takes it some seconds after it starts, so that waiting
    # for the stack waits for it. While it starts, Grafana is checked every second, so the wait ends
    # a second after it answers.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s
      start_interval: 1s

volumes:
  prometheus:
  alertmanager:
  loki:
  tempo:
  grafana:
