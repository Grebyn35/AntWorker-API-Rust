# The images of the tools that deploy.sh runs on its server. crane reads the registry, and cosign
# checks the signatures, when a deploy or `just server-check` verifies a release (OPS-12):
# compose.yaml at the root extends them for the release tasks, and deploy.sh reads their names
# from this file and runs deploy/verify-release.sh before it pulls a release. curl and yq import
# the release's dashboards and alert rules into a managed Grafana (D42), through
# deploy/import-grafana.sh, and `just server-check` runs curl against the buckets and a managed
# backend.

services:
  crane:
    image: gcr.io/go-containerregistry/crane:v0.22.1@sha256:1f968817b95790bed063f71175aa6b8ff879fa17064020415f3e18bb6e6a36e1

  cosign:
    image: ghcr.io/sigstore/cosign/cosign:v3.1.4@sha256:0f06154836d2de34f887a5c273506d52ca43edaa1d9e53e6510fa78a48f69c2d

  curl:
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93

  yq:
    image: mikefarah/yq:4.54.3@sha256:7834187596ad56fd5a81436114e0b0b9dd54c91bb43946d1f7145b2be5f9c3d2
