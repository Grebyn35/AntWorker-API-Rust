# The images of the tools that a deploy runs on its server. crane reads the registry, and cosign
# checks the signatures, when it verifies a release (OPS-14): compose.yaml at the root extends
# them for the release tasks, and deploy.sh reads their names from this file and runs
# deploy/verify-release.sh before it pulls a release. curl and yq import the release's dashboards
# and alert rules into a managed Grafana (D42), through deploy/import-grafana.sh.

services:
  crane:
    image: gcr.io/go-containerregistry/crane:v0.22.1@sha256:1f968817b95790bed063f71175aa6b8ff879fa17064020415f3e18bb6e6a36e1

  cosign:
    image: ghcr.io/sigstore/cosign/cosign:v3.1.4@sha256:0f06154836d2de34f887a5c273506d52ca43edaa1d9e53e6510fa78a48f69c2d

  curl:
    image: curlimages/curl:8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac

  yq:
    image: mikefarah/yq:4.54.1@sha256:4b3d9475d65571d28cbb19544d3820ec2945e4c8b2f18279394282b8dc3a592e
