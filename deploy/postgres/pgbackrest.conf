# pgBackRest's options that every reference deployment shares (OPS-17). The deployment's own
# settings arrive as PGBACKREST_* variables, which the compose file sets from the deployment's
# settings, and the secrets through the `pgbackrest` wrapper, from secret files.
# docs/operations/backups.md describes the backups.

[global]
# Postgres runs this command to archive and to fetch the write-ahead log: the wrapper, which adds
# the secrets.
cmd=/usr/local/bin/pgbackrest
# The backups go to an S3-compatible bucket off the server, encrypted before they leave it
# (OPS-20). The passphrase comes from a secret file; without it, no backup can be restored.
repo1-type=s3
repo1-path=/pgbackrest
repo1-cipher-type=aes-256-cbc
# A full backup expires only once a newer one is at least as old as the retention, which the
# setting BACKUP_RETENTION_DAYS sets in days, so a restore always reaches back that far, however
# many full backups `just backup` and the restores take.
repo1-retention-full-type=time
compress-type=zst
# The backup starts at once, with a checkpoint, instead of waiting for the next one.
start-fast=y
process-max=2
# Logs go to the container's output, where Docker and the collector read them.
log-level-console=info
log-level-stderr=off
log-level-file=off

[db]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
