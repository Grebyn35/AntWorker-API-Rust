# The configuration of freshclam, which keeps the reference deployment's signatures up to date
# beside clamd (deploy/scanner/start.sh). Lines that freshclam.conf's sample sets and this file
# doesn't keep freshclam's defaults.

Foreground yes
LogTime yes

DatabaseDirectory /var/lib/clamav
# ClamAV's mirrors, over HTTPS (OPS-17), which freshclam also takes for a host written alone.
DatabaseMirror https://database.clamav.net

# How many times a day it checks for new signatures: ClamAV's default, every two hours, which
# keeps within the one check an hour that ClamAV's mirrors allow each server. Once it has new
# signatures, it tells clamd, which loads them while it goes on scanning with the old
# (deploy/scanner/start.sh).
Checks 12
