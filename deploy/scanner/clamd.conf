# The configuration of ClamAV's daemon, clamd, in every environment: the reference deployment's
# scanner, and development's and the tests' (the files spec's "Scanning"). Lines that clamd.conf's
# sample sets and this file doesn't keep clamd's defaults.

# In the container's foreground, logging to its output, with each line's time.
Foreground yes
LogTime yes

# The API's replicas send each upload's bytes over TCP (PLATFORM-079).
TCPSocket 3310

DatabaseDirectory /var/lib/clamav

# Where a stream that clamd scans is kept while it scans it: the container's memory.
TemporaryDirectory /tmp

# The longest stream it takes: 20 MiB, the largest FILE_MAX_BYTES (D107).
StreamMaxLength 20M

# A file whose contents pass a limit of the scan, such as an archive that unpacks to more than
# MaxScanSize, gets a Heuristics.Limits.Exceeded signature rather than an OK, so no file is
# stored with part of it unscanned (FILES-005).
AlertExceedsMax yes

# A scan stops after 35 seconds, in milliseconds: once the API has stopped waiting, after its 30
# (PLATFORM-079), so no answer of this limit reaches it, and a scan it gave up on stops soon.
MaxScanTime 35000
