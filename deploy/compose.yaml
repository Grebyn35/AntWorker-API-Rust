# The single-host reference deployment (D15, D20, D45): Caddy, the API in two colors, the bundled
# Postgres with its backups (D44), and the telemetry path (D42). deploy.sh runs it on its server,
# from the deployment's directory, with the settings in settings.env, which
# settings.env.example lists, and the values it derives in state/deploy.env. Profiles choose the
# optional services: `database` for the bundled Postgres, `telemetry` for the collector,
# `observability` for the self-hosted stack, and `managed-telemetry` for the collector that sends
# to a managed backend instead. docs/operations/deploy.md describes the deployment.

name: deployment

# Every container's log, which `just logs` reads, in Docker's `local` driver: at most five files
# of 20 MB each, the four older ones compressed, so no log grows without bound (OPS-16). Docker's
# default driver never rotates its file.
x-logging: &logging
  driver: local
  options:
    max-size: 20m
    max-file: "5"

# An API replica. The two colors differ only in their image.
x-api: &api
  logging: *logging
  command: ["serve"]
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment:
    ENVIRONMENT: production
    LISTEN_ADDR: 0.0.0.0:8080
    LOG_LEVEL: ${LOG_LEVEL:-info}
    MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-100}
    DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
    DATABASE_URL_FILE: /run/secrets/database_url
    OTEL_EXPORTER_OTLP_ENDPOINT: ${API_TELEMETRY_ENDPOINT:-}
    # Caddy stops sending requests to a draining replica within its health checks' interval and
    # timeout (deploy/caddy/sites/api.caddy), so the replica keeps serving for longer (OPS-06).
    SHUTDOWN_DELAY_SECONDS: "5"
    SHUTDOWN_DRAIN_SECONDS: "10"
  secrets: [database_url]
  # The shutdown delay and the drain take at most 15 seconds, and writing out telemetry the time
  # that the platform spec's Telemetry export bounds it to, which fits in the rest.
  stop_grace_period: 30s
  deploy:
    resources:
      limits:
        cpus: "${API_CPUS:-1}"
        memory: ${API_MEMORY:-512M}
  networks: [edge, data, telemetry]
  restart: unless-stopped

# pgBackRest's settings, from the deployment's (deploy/postgres/pgbackrest.conf has the rest).
x-backups: &backups
  PGBACKREST_REPO1_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
  PGBACKREST_REPO1_STORAGE_PORT: ${BACKUP_S3_PORT:-443}
  PGBACKREST_REPO1_S3_REGION: ${BACKUP_S3_REGION:-}
  PGBACKREST_REPO1_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
  PGBACKREST_REPO1_S3_URI_STYLE: ${BACKUP_S3_URI_STYLE:-host}
  # The certificates the bucket's certificate is checked against: the operating system's, or the
  # authority in certs/backup-ca.crt of the deployment's directory, when deploy.sh finds it there.
  PGBACKREST_REPO1_STORAGE_CA_FILE: ${BACKUP_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}
  PGBACKREST_REPO1_RETENTION_FULL: ${BACKUP_RETENTION_DAYS:-28}
  # pgBackRest's locks, in the volume that Postgres's container and the backup service's share, so
  # a scheduled backup and one that `just backup` asks for never run at once.
  PGBACKREST_LOCK_PATH: /var/run/postgresql/pgbackrest

services:
  caddy:
    image: caddy:2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    logging: *logging
    environment:
      API_ADDRESS: ${API_ADDRESS:?the API's address, in settings.env}
      GRAFANA_ADDRESS: ${GRAFANA_ADDRESS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # The spans of the API's site go to the collector, whose name every telemetry path answers
      # to; without telemetry, Caddy exports nothing, and its problems still carry trace IDs
      # (D53). Caddy exports its spans a second after they end, as the API does, for the
      # collector's tail sampling.
      OTEL_SERVICE_NAME: caddy
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_TRACES_EXPORTER: ${PROXY_TRACES_EXPORTER:?the proxy's exporter, in state/deploy.env}
      OTEL_BSP_SCHEDULE_DELAY: "1000"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy:ro
      - ./state/caddy:/etc/caddy-state:ro
      - caddy-data:/data
      - caddy-config:/config
      # The lines of the requests Caddy answers itself, which the collector reads.
      - caddy-logs:/var/log/caddy
    read_only: true
    tmpfs: [/tmp]
    # Caddy needs only to bind the ports below 1024.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    # The admin API's metrics, whose requests Caddy logs only at the debug level, where every other
    # request to the admin API adds a line to Caddy's log.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/metrics"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [edge, telemetry]
    restart: unless-stopped

  api-blue:
    <<: *api
    image: ${API_IMAGE_BLUE:?the image of the blue replicas, in state/deploy.env}

  api-green:
    <<: *api
    image: ${API_IMAGE_GREEN:?the image of the green replicas, in state/deploy.env}

  # The one-shot subcommands that a deploy runs with the release's image, before its replicas.
  bootstrap:
    image: ${API_IMAGE_NEW:?the release's image, in state/deploy.env}
    logging: *logging
    profiles: [tasks]
    command: ["bootstrap"]
    read_only: true
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${API_TELEMETRY_ENDPOINT:-}
      DATABASE_ADMIN_URL_FILE: /run/secrets/database_admin_url
      DATABASE_OWNER_URL_FILE: /run/secrets/database_owner_url
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_admin_url, database_owner_url, database_url]
    networks: [data, telemetry]

  # Gives each collector's state, where it keeps how far it read Caddy's log, to the user the
  # collector runs as. Docker creates a volume for root, and the collector's image holds no
  # directory to start one from.
  collector-state:
    image: caddy:2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    logging: *logging
    profiles: [tasks]
    user: root
    entrypoint: [chown, "10001:10001", /var/lib/collector, /var/lib/collector-managed]
    volumes:
      - collector-state:/var/lib/collector
      - collector-managed-state:/var/lib/collector-managed
    network_mode: none

  migrate:
    image: ${API_IMAGE_NEW:?the release's image, in state/deploy.env}
    logging: *logging
    profiles: [tasks]
    command: ["migrate"]
    read_only: true
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${API_TELEMETRY_ENDPOINT:-}
      DATABASE_OWNER_URL_FILE: /run/secrets/database_owner_url
    secrets: [database_owner_url]
    networks: [data, telemetry]

  # The bundled Postgres, which archives its write-ahead log to the backup bucket (OPS-17). Only
  # the network `data` reaches it.
  postgres:
    image: ${POSTGRES_IMAGE:?the Postgres image, in state/deploy.env}
    logging: *logging
    profiles: [database]
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=db archive-push %p
      - -c
      - archive_timeout=60
    environment:
      <<: *backups
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: api
    secrets: [postgres_password, backup_s3_key, backup_s3_key_secret, backup_cipher_pass]
    volumes:
      - postgres:/var/lib/postgresql
      - postgres-socket:/var/run/postgresql
      - backup-status:/var/lib/backup-status
      - ./certs:/etc/deployment-certs:ro
    healthcheck:
      # Over TCP: while the image initializes a new database, it runs a server that listens only
      # on its socket, then stops it and starts the real one.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=api"]
      interval: 5s
      timeout: 5s
      retries: 30
    stop_grace_period: 60s
    networks: [data]
    restart: unless-stopped

  # The scheduled base backups, taken from Postgres's data directory and its socket.
  backup:
    image: ${POSTGRES_IMAGE:?the Postgres image, in state/deploy.env}
    logging: *logging
    profiles: [database]
    user: postgres
    entrypoint: ["backup-schedule"]
    environment:
      <<: *backups
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    secrets: [backup_s3_key, backup_s3_key_secret, backup_cipher_pass]
    volumes:
      - postgres:/var/lib/postgresql:ro
      - postgres-socket:/var/run/postgresql
      - backup-status:/var/lib/backup-status
      - ./certs:/etc/deployment-certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    restart: unless-stopped

  # The collector, which every telemetry path keeps (D42). It reads the backups' status files,
  # and Caddy's log, with the proxy's configuration (observability/collector/proxy.yaml).
  collector:
    extends: { file: observability/compose.yaml, service: collector }
    logging: *logging
    profiles: [telemetry]
    command: ["--config=/etc/collector/config.yaml", "--config=/etc/collector/proxy.yaml"]
    volumes:
      - backup-status:/var/lib/backup-status:ro
      - caddy-logs:/var/log/caddy:ro
      - collector-state:/var/lib/collector
    networks: [telemetry]
    restart: unless-stopped

  # The collector with a managed backend in place of the self-hosted stack (D42): the same
  # receivers and processors, with the backend's exporter (observability/collector/managed.yaml).
  # It answers as `collector`, so the API's settings are the same.
  collector-managed:
    extends: { file: observability/compose.yaml, service: collector }
    logging: *logging
    profiles: [managed-telemetry]
    command:
      - --config=/etc/collector/config.yaml
      - --config=/etc/collector/proxy.yaml
      - --config=/etc/collector/managed.yaml
    environment:
      MANAGED_OTLP_ENDPOINT: ${MANAGED_OTLP_ENDPOINT:-}
      MANAGED_OTLP_USER: ${MANAGED_OTLP_USER:-}
      # The certificates the backend's certificate is checked against: the operating system's,
      # or the authority in certs/managed-otlp-ca.crt, when deploy.sh finds it there.
      MANAGED_OTLP_CA_FILE: ${MANAGED_OTLP_CA_FILE:-}
    volumes:
      - backup-status:/var/lib/backup-status:ro
      - ./certs:/etc/deployment-certs:ro
      - caddy-logs:/var/log/caddy:ro
      # A state of its own, since both collectors run for a moment while a deploy moves from one
      # to the other, and each locks its state.
      - collector-managed-state:/var/lib/collector
    secrets: [managed_otlp_token]
    networks:
      telemetry:
        aliases: [collector]
    restart: unless-stopped

  prometheus:
    extends: { file: observability/compose.yaml, service: prometheus }
    logging: *logging
    profiles: [observability]
    networks: [telemetry]
    restart: unless-stopped

  alertmanager:
    extends: { file: observability/compose.yaml, service: alertmanager }
    logging: *logging
    profiles: [observability]
    # The credentials of the integrations that alertmanager.yaml names, which the deployment keeps
    # in secrets/alertmanager/ (docs/operations/observability.md).
    volumes:
      - ./secrets/alertmanager:/etc/alertmanager-secrets:ro
    networks: [telemetry]
    restart: unless-stopped

  loki:
    extends: { file: observability/compose.yaml, service: loki }
    logging: *logging
    profiles: [observability]
    networks: [telemetry]
    restart: unless-stopped

  tempo:
    extends: { file: observability/compose.yaml, service: tempo }
    logging: *logging
    profiles: [observability]
    networks: [telemetry]
    restart: unless-stopped

  # Grafana, at its own address behind Caddy, where every viewer signs in (D42).
  grafana:
    extends: { file: observability/compose.yaml, service: grafana }
    logging: *logging
    profiles: [observability]
    environment:
      GF_SERVER_ROOT_URL: https://${GRAFANA_ADDRESS:-}/
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: [grafana_admin_password]
    networks: [edge, telemetry]
    restart: unless-stopped

networks:
  # Caddy, the replicas and Grafana.
  edge:
  # The replicas, the one-shot subcommands, Postgres and its backups.
  data:
  # Everything that sends or stores telemetry.
  telemetry:

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
  collector-state:
  collector-managed-state:
  postgres:
  postgres-socket:
  backup-status:
  prometheus:
  alertmanager:
  loki:
  tempo:
  grafana:

# The secret files, in secrets/ of the deployment's directory. deploy.sh writes the URLs of the
# bundled Postgres and Grafana's password; `just server-setup` writes the others
# (docs/operations/deploy.md).
secrets:
  database_url:
    file: ./secrets/database_url
  database_owner_url:
    file: ./secrets/database_owner_url
  database_admin_url:
    file: ./secrets/database_admin_url
  postgres_password:
    file: ./secrets/postgres_password
  backup_s3_key:
    file: ./secrets/backup_s3_key
  backup_s3_key_secret:
    file: ./secrets/backup_s3_key_secret
  backup_cipher_pass:
    file: ./secrets/backup_cipher_pass
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  managed_otlp_token:
    file: ./secrets/managed_otlp_token
