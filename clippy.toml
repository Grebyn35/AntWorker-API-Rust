too-many-lines-threshold = 80
too-many-arguments-threshold = 6
allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-methods = [
    { path = "std::thread::sleep", reason = "every wait goes through platform::clock (CODE-06)" },
    { path = "std::time::SystemTime::now", reason = "time comes from platform::clock (CODE-06)" },
    { path = "std::fs::read", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::read_to_string", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::write", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
]
