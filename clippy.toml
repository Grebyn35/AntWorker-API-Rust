too-many-lines-threshold = 80
too-many-arguments-threshold = 6
allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-methods = [
    { path = "std::thread::sleep", reason = "every wait goes through platform::clock (CODE-06)" },
    { path = "tokio::time::sleep", reason = "every wait goes through platform::clock (CODE-06)" },
    { path = "tokio::time::sleep_until", reason = "every wait goes through platform::clock (CODE-06)" },
    { path = "tokio::time::interval", reason = "every wait goes through platform::clock (CODE-06)" },
    { path = "tokio::time::interval_at", reason = "every wait goes through platform::clock (CODE-06)" },
    { path = "tokio::time::timeout", reason = "every wait goes through platform::clock (CODE-06)" },
    { path = "tokio::time::timeout_at", reason = "every wait goes through platform::clock (CODE-06)" },
    { path = "std::time::SystemTime::now", reason = "time comes from platform::clock (CODE-06)" },
    { path = "std::fs::canonicalize", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::copy", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::create_dir", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::create_dir_all", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::exists", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::hard_link", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::metadata", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::read", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::read_dir", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::read_link", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::read_to_string", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::remove_dir", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::remove_dir_all", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::remove_file", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::rename", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::set_permissions", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::symlink_metadata", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::write", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::File::open", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::File::create", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::File::create_new", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::fs::OpenOptions::open", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::path::Path::canonicalize", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::path::Path::exists", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::path::Path::try_exists", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::path::Path::is_dir", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::path::Path::is_file", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::path::Path::is_symlink", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::path::Path::metadata", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::path::Path::read_dir", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::path::Path::read_link", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "std::path::Path::symlink_metadata", reason = "blocking file I/O stalls the async runtime (CODE-05)" },
    { path = "sqlx::query", reason = "SQL goes through the query! macros, checked at compile time (DATA-20)" },
    { path = "sqlx::query_with", reason = "SQL goes through the query! macros, checked at compile time (DATA-20)" },
    { path = "sqlx::query_as", reason = "SQL goes through the query! macros, checked at compile time (DATA-20)" },
    { path = "sqlx::query_as_with", reason = "SQL goes through the query! macros, checked at compile time (DATA-20)" },
    { path = "sqlx::query_scalar", reason = "SQL goes through the query! macros, checked at compile time (DATA-20)" },
    { path = "sqlx::query_scalar_with", reason = "SQL goes through the query! macros, checked at compile time (DATA-20)" },
    { path = "sqlx::raw_sql", reason = "SQL goes through the query! macros, checked at compile time (DATA-20)" },
