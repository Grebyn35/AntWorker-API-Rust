disallowed-types = [
    { path = "sqlx::Pool", reason = "queries run in a unit of work, never on a pool (DATA-21)" },
    { path = "sqlx::PgPool", reason = "queries run in a unit of work, never on a pool (DATA-21)" },
    { path = "sqlx::pool::PoolOptions", reason = "only platform::db opens a pool (DATA-21)" },
    { path = "sqlx::postgres::PgPoolOptions", reason = "only platform::db opens a pool (DATA-21)" },
    { path = "sqlx::pool::PoolConnection", reason = "queries run in a unit of work, never on a connection (DATA-21)" },
    { path = "sqlx::PgConnection", reason = "queries run in a unit of work, never on a connection (DATA-21)" },
    { path = "sqlx::Transaction", reason = "the unit of work is the only transaction (DATA-21, ARCH-11)" },
    { path = "sqlx::postgres::PgTransaction", reason = "the unit of work is the only transaction (DATA-21, ARCH-11)" },
]
