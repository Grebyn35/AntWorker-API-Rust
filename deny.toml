[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every advisory fails the check, whether it affects a direct dependency or a transitive one
# (SEC-15), but the notices that `ignore` lists by their IDs, each with its reason. A
# vulnerability in a crate whose notice is ignored is an advisory of its own, which fails the
# check.
unmaintained = "all"
unsound = "all"
ignore = [
    # part: files
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, and object_store, the client of the files bucket, requires it in its newest release (D173)" },
    { id = "RUSTSEC-2026-0542", reason = "humantime is unmaintained, and object_store, the client of the files bucket, requires it in its newest release (D173)" },
    # end part: files
]

# `just deny` checks licenses for each target the API is built for (CODE-13), and advisories,
# bans and sources for every target (SEC-15).
[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "openssl", reason = "cryptography comes from RustCrypto and rustls with ring (SEC-16)" },
    { name = "openssl-sys", reason = "cryptography comes from RustCrypto and rustls with ring (SEC-16)" },
    { name = "native-tls", reason = "cryptography comes from RustCrypto and rustls with ring (SEC-16)" },
    { name = "aws-lc-rs", reason = "rustls uses the ring provider (SEC-16)" },
    { name = "aws-lc-sys", reason = "rustls uses the ring provider (SEC-16)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# The workspace's own crates are unpublished, and their license is chosen before the first public release.
[licenses.private]
ignore = true
