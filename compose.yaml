# The services the API needs on a developer's machine, and the images of the tools the tasks run.
# `just services` starts Postgres, and `just dev observe` the observability stack too, whose
# services carry the `observability` profile. Every port is published on 127.0.0.1 only.

services:
  postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    # This database holds nothing that can't be recreated, so it skips fsync. Every test
    # database created or dropped forces a checkpoint, and on some machines one fsync stalls
    # for minutes. A crash of the machine can corrupt the data; `docker compose down --volumes`
    # starts it fresh.
    command: ["postgres", "-c", "fsync=off"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run just setup to write .env}
      POSTGRES_DB: api
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--username=postgres", "--dbname=api"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The observability stack, in the same topology as in production (D19):
  # docs/operations/observability.md describes it.
  collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
    command: ["--config=/etc/collector/config.yaml"]
    volumes:
      - ./deploy/observability/collector/config.yaml:/etc/collector/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on: [prometheus, loki, tempo]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-otlp-receiver
    volumes:
      - ./deploy/observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./deploy/observability/prometheus/rules.yaml:/etc/prometheus/rules.yaml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    profiles: [observability]
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/observability/alertmanager/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  loki:
    profiles: [observability]
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki:/loki
    ports:
      - "127.0.0.1:3100:3100"

  tempo:
    profiles: [observability]
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-target=all", "-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./deploy/observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    # On a developer's machine, anyone who reaches 127.0.0.1:3000 views the dashboards and explores
    # without signing in.
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, loki, tempo, alertmanager]

  # The images the image tasks run, under the `tools` profile, so the dependency updates that
  # reach every other image reach them too (docs/operations/ci.md). The tasks run them with
  # `docker compose run`, or read their names with `docker compose config --images`. Only the
  # registry, to which `just e2e` pushes the image, runs as a service.
  registry:
    profiles: [tools]
    image: registry:3.1.2@sha256:01cd312e67026f06f5d89c3e133a4a9adc7cb9eeb9b1194e0b2954dfd770efd2
    ports:
      - "127.0.0.1:5001:5000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5000/v2/"]
      interval: 2s
      timeout: 5s
      retries: 30

  crane:
    profiles: [tools]
    image: gcr.io/go-containerregistry/crane:v0.22.1@sha256:1f968817b95790bed063f71175aa6b8ff879fa17064020415f3e18bb6e6a36e1
    volumes:
      - ./target/image:/image:ro

  grype:
    profiles: [tools]
    image: anchore/grype:v0.121.0@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea
    environment:
      GRYPE_DB_CACHE_DIR: /cache
    volumes:
      - ./target/image:/image:ro
      - grype:/cache

  cosign:
    profiles: [tools]
    image: ghcr.io/sigstore/cosign/cosign:v3.1.4@sha256:0f06154836d2de34f887a5c273506d52ca43edaa1d9e53e6510fa78a48f69c2d

  # shellcheck, which `just check-shell` runs on the justfile's recipes and the deployment's
  # scripts (CODE-16).
  shellcheck:
    profiles: [tools]
    image: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

  # Installs QEMU, through which a Linux machine runs another platform's binaries, such as CI's
  # runner for the arm64 image.
  binfmt:
    profiles: [tools]
    image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
    privileged: true

  # BuildKit, which builds the image, and the generator of its software bill of materials (SBOM).
  # The image tasks pass their names to Docker's builder.
  buildkit:
    profiles: [tools]
    image: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

  sbom-generator:
    profiles: [tools]
    image: docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

volumes:
  postgres:
  grype:
  prometheus:
  alertmanager:
  loki:
  tempo:
  grafana:
