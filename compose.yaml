# The services the API needs on a developer's machine, and the images of the tools the tasks run.
# `just services` starts Postgres and Mailpit, and `just dev observe` the observability stack too,
# whose services carry the `observability` profile. Every port is published on 127.0.0.1 only.
# `just services` also starts the bucket of files' bytes and the malware scanner. # part: files

services:
  postgres:
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    # This database holds nothing that can't be recreated, so it skips fsync, and so does initdb
    # when it creates the data directory, as it does for each server that the end-to-end tests
    # start from this service. Every test database created or dropped forces a checkpoint, and on
    # some machines one fsync stalls for minutes. A crash of the machine can corrupt the data;
    # `docker compose down --volumes` starts it fresh. A test's database is cloned from its
    # template page by page through the write-ahead log, nearly all that the tests make this
    # database write to disk, so the log's pages are compressed: by about three quarters, at no
    # cost in time that the tests show.
    command: ["postgres", "-c", "fsync=off", "-c", "wal_compression=zstd"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run just setup to write .env}
      POSTGRES_DB: api
      POSTGRES_INITDB_ARGS: --no-sync
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      # Over TCP: while the image initializes a new database, it runs a server that listens only
      # on its socket, then stops it and starts the real one.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=api"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Catches every email the API sends in development and in the tests, so nothing leaves the
  # machine (PLATFORM-023): its SMTP server listens on 1025, with no TLS and no credentials, and its
  # web page and API on 8025. It keeps the latest 10,000 emails, so the tests' emails stay until
  # each test has read its own.
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    environment:
      MP_MAX_MESSAGES: "10000"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

  # part: files
  # The bucket that holds files' bytes in development and in the tests (the files spec's
  # "Storage"): SeaweedFS's S3 server, which asks for no credentials while it is given none, so the
  # API's keys in .env reach it whatever they hold, as Mailpit takes no credentials. It runs every
  # part of SeaweedFS in one process, with room for as many volumes as its collections grow: each
  # bucket is a collection, which grows 7 volumes at its first write, and a deleted bucket's go a
  # while after, so the tests' buckets, one for each test that runs at once, need hundreds, while
  # an empty volume costs a few bytes. Its health check creates the bucket `files`, which `just
  # dev` uses, and passes once it exists; each test that runs the API creates a bucket of its own,
  # and deletes it when it ends.
  storage:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    command: ["server", "-dir=/data", "-volume.max=1000", "-s3", "-s3.port=8333"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - storage:/data
    healthcheck:
      test:
        - CMD-SHELL
        - echo 's3.bucket.create -name files' | weed shell -master=localhost:9333 -filer=localhost:8888 2>&1 | grep -q -e 'created bucket files' -e 'bucket files already exists'
      interval: 60s
      timeout: 10s
      start_period: 60s
      start_interval: 1s
      retries: 3

  # The malware scanner of development and the tests, from the service that
  # deploy/scanner/compose.yaml defines for every environment: clamd alone, with the
  # configuration of every environment and one signature, which names the EICAR test file, so it
  # starts in seconds with little memory, and nothing reaches ClamAV's mirrors (TEST-06).
  scanner:
    extends: { file: deploy/scanner/compose.yaml, service: scanner }
    entrypoint: ["clamd", "--config-file=/etc/scanner/clamd.conf"]
    volumes:
      - ./deploy/scanner/clamd.conf:/etc/scanner/clamd.conf:ro
      - ./deploy/scanner/eicar.ndb:/var/lib/clamav/eicar.ndb:ro
    ports:
      - "127.0.0.1:3310:3310"
    healthcheck:
      interval: 2s
      timeout: 5s
      retries: 30
  # end part: files

  # The observability stack, in the same topology as in production (D19), from the services that
  # deploy/observability/compose.yaml defines for both: docs/operations/observability.md describes
  # it. Here each service publishes its port, and Grafana opens without signing in.
  collector:
    extends: { file: deploy/observability/compose.yaml, service: collector }
    profiles: [observability]
    ports:
      - "127.0.0.1:4318:4318"
    depends_on: [prometheus, loki, tempo]

  prometheus:
    extends: { file: deploy/observability/compose.yaml, service: prometheus }
    profiles: [observability]
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    extends: { file: deploy/observability/compose.yaml, service: alertmanager }
    profiles: [observability]
    ports:
      - "127.0.0.1:9093:9093"

  loki:
    extends: { file: deploy/observability/compose.yaml, service: loki }
    profiles: [observability]
    ports:
      - "127.0.0.1:3100:3100"

  tempo:
    extends: { file: deploy/observability/compose.yaml, service: tempo }
    profiles: [observability]
    ports:
      - "127.0.0.1:3200:3200"

  grafana:
    extends: { file: deploy/observability/compose.yaml, service: grafana }
    profiles: [observability]
    # On a developer's machine, anyone who reaches 127.0.0.1:3000 views the dashboards and explores
    # without signing in.
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, loki, tempo, alertmanager]

  # The images the image tasks run, under the `tools` profile, so the dependency updates that
  # reach every other image reach them too (docs/operations/ci.md). The tasks run them with
  # `docker compose run`, or read their names with `docker compose config --images`. Only the
  # registry, to which the end-to-end tests and `just load-test` push the images under test, and the
  # mirror run as services.
  registry:
    profiles: [tools]
    image: registry:3.1.2@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
    ports:
      - "127.0.0.1:5001:5000"
    healthcheck: &registry-health
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5000/v2/"]
      interval: 2s
      timeout: 5s
      retries: 30

  # A cache of Docker Hub, from which the end-to-end tests' servers pull every image that Docker
  # Hub serves. `just e2e` fills it for the servers' platform before the tests run, so no test
  # reaches a registry outside (TEST-06). It keeps what it holds between runs.
  mirror:
    profiles: [tools]
    image: registry:3.1.2@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
    volumes:
      - mirror:/var/lib/registry
    healthcheck: *registry-health

  crane:
    extends: { file: deploy/tools/compose.yaml, service: crane }
    profiles: [tools]
    volumes:
      - ./target/image:/image:ro
      - ./target/image-postgres:/image-postgres:ro

  # The scanner of the images (SEC-15). Its database stays in a volume between runs, and its
  # temporary files, the images' layers that it unpacks to read their packages, are in memory,
  # so a scan writes to disk only the database that a new day's first scan downloads.
  grype:
    profiles: [tools]
    image: anchore/grype:v0.121.2@sha256:6a36234da13f9faa327306ac0b3dab3405cfa2b4eb20c8f904125a8707863913
    environment:
      GRYPE_DB_CACHE_DIR: /cache
    tmpfs:
      - /tmp
    volumes:
      - ./target/image:/image:ro
      - ./target/image-postgres:/image-postgres:ro
      - grype:/cache

  cosign:
    extends: { file: deploy/tools/compose.yaml, service: cosign }
    profiles: [tools]

  # The server that the end-to-end tests deploy to: Docker in a container of its own, running the
  # reference deployment as a server's Docker would (TEST-03, OPS-14).
  server:
    profiles: [tools]
    image: docker:29.9.3-dind@sha256:08a98015fce594af7c382883bea080ea206de74402a95da9dc52b6428c8cd121

  # The stand-in for the reference deployment's backup bucket, which the end-to-end tests run on
  # their server: SeaweedFS, which serves the S3 protocol (OPS-15).
  bucket:
    profiles: [tools]
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59

  # k6, which `just load-test` runs to measure one replica's capacity (OPS-16). It reaches the
  # collector, on the same network, to count the spans the collector accepted.
  k6:
    profiles: [tools]
    image: grafana/k6:2.3.0@sha256:2dd4756ec6e14e62778916e1eb850108e4b499304c02df56760fa0bdb0fba0b8

  # shellcheck, which `just check-shell` runs on the justfile's recipes and the deployment's
  # scripts (CODE-07).
  shellcheck:
    profiles: [tools]
    image: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

  # Installs QEMU, through which a Linux machine runs another platform's binaries, such as the
  # arm64 image's end-to-end tests on an amd64 machine.
  binfmt:
    profiles: [tools]
    image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
    privileged: true

  # BuildKit, which builds the image, and the generator of its software bill of materials (SBOM).
  # The image tasks pass their names to Docker's builder.
  buildkit:
    profiles: [tools]
    image: moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

  sbom-generator:
    profiles: [tools]
    image: docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315

volumes:
  postgres:
  # part: files
  storage:
  # end part: files
  grype:
  mirror:
  prometheus:
  alertmanager:
  loki:
  tempo:
  grafana:
