# The services the API needs on a developer's machine, and the images of the tools the tasks run.
# `just services` starts the development Postgres, the tests' Postgres and Mailpit, and
# `just dev observe` the observability stack too, whose services carry the `observability`
# profile. Every port is published on 127.0.0.1 only.
# `just services` also starts the bucket of files' bytes and the malware scanner. # part: files

# The output that Docker keeps of each service that runs between the tasks, in Docker's `local`
# driver: at most five files of 20 MB each, the four older ones compressed, as the reference
# deployment's services keep theirs, so none grows for as long as its container lives (OPS-21).
# Docker's default driver never rotates its file.
x-logging: &logging
  driver: local
  options:
    max-size: 20m
    max-file: "5"

services:
  postgres:
    logging: *logging
    image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    # The development Postgres. It holds nothing that can't be recreated, so it skips
    # fsync, and so does initdb when it creates the data directory, as it does for each server
    # that the end-to-end tests start from this service: each database that a check drops here
    # forces a checkpoint, and on some machines one fsync stalls for minutes. A crash of the
    # machine can corrupt the data; `docker compose down --volumes` starts it fresh.
    command: ["postgres", "-c", "fsync=off"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run just setup to write .env}
      POSTGRES_DB: api
      POSTGRES_INITDB_ARGS: --no-sync
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      # Over TCP: while the image initializes a new database, it runs a server that listens only
      # on its socket, then stops it and starts the real one.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=api"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The tests' Postgres (TEST-05), on port 5433: a server of the tests' own, of the same image,
  # whose data is in memory. Each test clones a database and drops it, and each drop has the
  # server write every page that changed since the drop before, which a server that keeps its
  # data on disk writes there (D163). The data is gone when the container stops, and the first
  # test of the next run makes the roles and the template again. It holds 2 gibibytes at most,
  # and a test waits to create its database while too many wait to be dropped (OPS-21).
  postgres-tests:
    logging: *logging
    image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run just setup to write .env}
      POSTGRES_DB: api
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql
        tmpfs:
          size: 2147483648
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=api"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Catches every email the API sends in development and in the tests, so nothing leaves the
  # machine (PLATFORM-023): its SMTP server listens on 1025, with no TLS and no credentials, and its
  # web page and API on 8025. It keeps the latest 10,000 emails, so the tests' emails stay until
  # each test has read its own.
  mailpit:
    logging: *logging
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    environment:
      MP_MAX_MESSAGES: "10000"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

  # part: files
  # The bucket that holds files' bytes in development and in the tests (the files spec's
  # "Storage"): SeaweedFS's S3 server, which asks for no credentials while it is given none, so the
  # API's keys in .env reach it whatever they hold, as Mailpit takes no credentials. It runs every
  # part of SeaweedFS in one process, with room for as many volumes as its collections grow: each
  # bucket is a collection, which grows one volume at its first write, as
  # WEED_MASTER_VOLUME_GROWTH_COPY_1 sets. SeaweedFS's own seven grow one after another, for most
  # of a second, and a bucket deleted meanwhile, as a short test's is, keeps those grown after
  # it, which nothing deletes, so the runs of the tests would fill the server's thousand. Its
  # health check creates the bucket `files`, which `just dev` uses, and passes once it exists;
  # each test that runs the API creates a bucket of its own, which the tests delete once it ends.
  storage:
    logging: *logging
    image: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    command: ["server", "-dir=/data", "-volume.max=1000", "-s3", "-s3.port=8333"]
    environment:
      WEED_MASTER_VOLUME_GROWTH_COPY_1: "1"
    # Its filer's port too, on which a run of the tests lists the buckets that earlier runs
    # left: the S3 API lists a caller its own buckets, and the tests' requests are no one's.
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:8334:8888"
    volumes:
      - storage:/data
    healthcheck:
      test:
        - CMD-SHELL
        - echo 's3.bucket.create -name files' | weed shell -master=localhost:9333 -filer=localhost:8888 2>&1 | grep -q -e 'created bucket files' -e 'bucket files already exists'
      interval: 60s
      timeout: 10s
      start_period: 60s
      start_interval: 1s
      retries: 3

  # The malware scanner of development and the tests, from the service that
  # deploy/scanner/compose.yaml defines for every environment: clamd alone, with the
  # configuration of every environment and one signature, which names the EICAR test file, so it
  # starts in seconds with little memory, and nothing reaches ClamAV's mirrors (TEST-06).
  scanner:
    logging: *logging
    extends: { file: deploy/scanner/compose.yaml, service: scanner }
    entrypoint: ["clamd", "--config-file=/etc/scanner/clamd.conf"]
    volumes:
      - ./deploy/scanner/clamd.conf:/etc/scanner/clamd.conf:ro
      - ./deploy/scanner/eicar.ndb:/var/lib/clamav/eicar.ndb:ro
    ports:
      - "127.0.0.1:3310:3310"
    healthcheck:
      interval: 2s
      timeout: 5s
      retries: 30
  # end part: files

  # The observability stack, in the same topology as in production (D19), from the services that
  # deploy/observability/compose.yaml defines for both: docs/operations/observability.md describes
  # it. Here each service publishes its port, and Grafana opens without signing in.
  collector:
    logging: *logging
    extends: { file: deploy/observability/compose.yaml, service: collector }
    profiles: [observability]
    ports:
      - "127.0.0.1:4318:4318"
      # part: client_telemetry
      # The receiver of the batches of telemetry that the API forwards for users' clients, which
      # CLIENT_TELEMETRY_ENDPOINT names.
      - "127.0.0.1:4319:4319"
      # end part: client_telemetry
    depends_on: [prometheus, loki, tempo]

  prometheus:
    logging: *logging
    extends: { file: deploy/observability/compose.yaml, service: prometheus }
    profiles: [observability]
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    logging: *logging
    extends: { file: deploy/observability/compose.yaml, service: alertmanager }
    profiles: [observability]
    ports:
      - "127.0.0.1:9093:9093"

  loki:
    logging: *logging
    extends: { file: deploy/observability/compose.yaml, service: loki }
    profiles: [observability]
    ports:
      - "127.0.0.1:3100:3100"

  tempo:
    logging: *logging
    extends: { file: deploy/observability/compose.yaml, service: tempo }
    profiles: [observability]
    ports:
      - "127.0.0.1:3200:3200"

  grafana:
    logging: *logging
    extends: { file: deploy/observability/compose.yaml, service: grafana }
    profiles: [observability]
    # On a developer's machine, anyone who reaches 127.0.0.1:3000 views the dashboards and explores
    # without signing in.
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, loki, tempo, alertmanager]

  # The images the image tasks run, under the `tools` profile, so the dependency updates that
  # reach every other image reach them too (docs/operations/ci.md). The tasks run them with
  # `docker compose run`, or read their names with `docker compose config --images`. Only the
  # registry, to which the end-to-end tests and `just load-test` push the images under test, the
  # mirror, and `mirror-fill` while the mirror's store fills, run as services.
  registry:
    logging: *logging
    profiles: [tools]
    image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
    ports:
      - "127.0.0.1:5001:5000"
    healthcheck: &registry-health
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5000/v2/"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The registry from which the end-to-end tests' servers pull every image that Docker Hub
  # serves, as their Docker's mirror of it. It has no upstream and serves what its store holds,
  # so no test reaches a registry outside (TEST-06). `just e2e` fills the store for the servers'
  # platform before the tests run, through `mirror-fill`, unless the same list of images filled
  # it before, and empties it first when another list did (OPS-21). The store is the volume
  # `mirror`, or the directory that MIRROR_STORE names, as CI's jobs do, which keep it between
  # runs (docs/operations/ci.md).
  mirror:
    logging: *logging
    profiles: [tools]
    image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
    volumes:
      - ${MIRROR_STORE:-mirror}:/var/lib/registry
    healthcheck: *registry-health

  # A cache of Docker Hub on the mirror's store, which `just e2e` runs only while it fills the
  # store: what is fetched through it stays there. It has no time to live: with one, the
  # registry deletes a layer that two repositories share once the entry of the first that
  # fetched it ends, and goes on answering the other's requests for it with a 200 and no bytes.
  mirror-fill:
    profiles: [tools]
    image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
      REGISTRY_PROXY_TTL: 0
    volumes:
      - ${MIRROR_STORE:-mirror}:/var/lib/registry
    healthcheck: *registry-health

  crane:
    extends: { file: deploy/tools/compose.yaml, service: crane }
    profiles: [tools]
    volumes:
      - ./target/image:/image:ro
      - ./target/image-postgres:/image-postgres:ro

  # The scanner of the images (SEC-15). Its database stays in a volume between runs, and its
  # temporary files, the images' layers that it unpacks to read their packages, are in memory,
  # so a scan writes to disk only the database that a new day's first scan downloads.
  grype:
    profiles: [tools]
    image: anchore/grype:v0.122.1@sha256:661583704a253c0448ed63998b5ea2cd9d5a76ee71eedc4aed439b8ce3e93a1c
    environment:
      GRYPE_DB_CACHE_DIR: /cache
    tmpfs:
      - /tmp
    volumes:
      - ./target/image:/image:ro
      - ./target/image-postgres:/image-postgres:ro
      - grype:/cache

  cosign:
    extends: { file: deploy/tools/compose.yaml, service: cosign }
    profiles: [tools]

  # The server that the end-to-end tests deploy to: Docker in a container of its own, running the
  # reference deployment as a server's Docker would (TEST-03, OPS-14).
  server:
    profiles: [tools]
    image: docker:29.10.0-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c

  # The stand-in for the reference deployment's backup bucket, which the end-to-end tests run on
  # their server: SeaweedFS, which serves the S3 protocol (OPS-15).
  bucket:
    profiles: [tools]
    image: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15

  # k6, which `just load-test` runs to measure one replica's capacity (OPS-16). It reaches the
  # collector, on the same network, to count the spans the collector accepted.
  k6:
    profiles: [tools]
    image: grafana/k6:2.4.0@sha256:d41bb79cd8de5a7ad619b53570e3712633e8bff0937010a5c6c57a4747e7a276

  # shellcheck, which `just check-shell` runs on the justfile's recipes and the deployment's
  # scripts (CODE-07).
  shellcheck:
    profiles: [tools]
    image: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

  # Installs QEMU, through which a Linux machine runs another platform's binaries, such as the
  # arm64 image's end-to-end tests on an amd64 machine.
  binfmt:
    profiles: [tools]
    image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
    privileged: true

  # BuildKit, which builds the image, and the generator of its software bill of materials (SBOM).
  # The image tasks pass their names to Docker's builder.
  buildkit:
    profiles: [tools]
    image: moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb

  sbom-generator:
    profiles: [tools]
    image: docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315

volumes:
  postgres:
  # part: files
  storage:
  # end part: files
  grype:
  mirror:
  prometheus:
  alertmanager:
  loki:
  tempo:
  grafana:
