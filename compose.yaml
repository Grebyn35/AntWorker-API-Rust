# The services the API needs on a developer's machine. `just services` starts Postgres, and
# `just dev observe` the observability stack too, whose services carry the `observability`
# profile. Every port is published on 127.0.0.1 only.

services:
  postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    # This database holds nothing that can't be recreated, so it skips fsync. Every test
    # database created or dropped forces a checkpoint, and on some machines one fsync stalls
    # for minutes. A crash of the machine can corrupt the data; `docker compose down --volumes`
    # starts it fresh.
    command: ["postgres", "-c", "fsync=off"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run just setup to write .env}
      POSTGRES_DB: api
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--username=postgres", "--dbname=api"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The observability stack, in the same topology as in production (D19):
  # docs/operations/observability.md describes it.
  collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    command: ["--config=/etc/collector/config.yaml"]
    volumes:
      - ./deploy/observability/collector/config.yaml:/etc/collector/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on: [prometheus, loki, tempo]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-otlp-receiver
    volumes:
      - ./deploy/observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./deploy/observability/prometheus/rules.yaml:/etc/prometheus/rules.yaml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    profiles: [observability]
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/observability/alertmanager/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  loki:
    profiles: [observability]
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki:/loki
    ports:
      - "127.0.0.1:3100:3100"

  tempo:
    profiles: [observability]
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    command: ["-target=all", "-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./deploy/observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    # On a developer's machine, anyone who reaches 127.0.0.1:3000 views the dashboards and explores
    # without signing in.
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, loki, tempo, alertmanager]

volumes:
  postgres:
  prometheus:
  alertmanager:
  loki:
  tempo:
  grafana:
