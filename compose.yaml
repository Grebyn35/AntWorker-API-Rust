# The services the API needs on a developer's machine, and the images of the tools the tasks run.
# `just services` starts Postgres, and `just dev observe` the observability stack too, whose
# services carry the `observability` profile. Every port is published on 127.0.0.1 only.

services:
  postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    # This database holds nothing that can't be recreated, so it skips fsync. Every test
    # database created or dropped forces a checkpoint, and on some machines one fsync stalls
    # for minutes. A crash of the machine can corrupt the data; `docker compose down --volumes`
    # starts it fresh.
    command: ["postgres", "-c", "fsync=off"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run just setup to write .env}
      POSTGRES_DB: api
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      # Over TCP: while the image initializes a new database, it runs a server that listens only
      # on its socket, then stops it and starts the real one.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=api"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The observability stack, in the same topology as in production (D19), from the services that
  # deploy/observability/compose.yaml defines for both: docs/operations/observability.md describes
  # it. Here each service publishes its port, and Grafana opens without signing in.
  collector:
    extends: { file: deploy/observability/compose.yaml, service: collector }
    profiles: [observability]
    ports:
      - "127.0.0.1:4318:4318"
    depends_on: [prometheus, loki, tempo]

  prometheus:
    extends: { file: deploy/observability/compose.yaml, service: prometheus }
    profiles: [observability]
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    extends: { file: deploy/observability/compose.yaml, service: alertmanager }
    profiles: [observability]
    ports:
      - "127.0.0.1:9093:9093"

  loki:
    extends: { file: deploy/observability/compose.yaml, service: loki }
    profiles: [observability]
    ports:
      - "127.0.0.1:3100:3100"

  tempo:
    extends: { file: deploy/observability/compose.yaml, service: tempo }
    profiles: [observability]
    ports:
      - "127.0.0.1:3200:3200"

  grafana:
    extends: { file: deploy/observability/compose.yaml, service: grafana }
    profiles: [observability]
    # On a developer's machine, anyone who reaches 127.0.0.1:3000 views the dashboards and explores
    # without signing in.
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, loki, tempo, alertmanager]

  # The images the image tasks run, under the `tools` profile, so the dependency updates that
  # reach every other image reach them too (docs/operations/ci.md). The tasks run them with
  # `docker compose run`, or read their names with `docker compose config --images`. Only the
  # registry, to which `just e2e` pushes the image, and the mirror run as services.
  registry:
    profiles: [tools]
    image: registry:3.1.2@sha256:01cd312e67026f06f5d89c3e133a4a9adc7cb9eeb9b1194e0b2954dfd770efd2
    ports:
      - "127.0.0.1:5001:5000"
    healthcheck: &registry-health
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5000/v2/"]
      interval: 2s
      timeout: 5s
      retries: 30

  # A cache of Docker Hub, from which the end-to-end tests' servers pull every image that Docker
  # Hub serves. `just e2e` fills it for the servers' platform before the tests run, so no test
  # reaches a registry outside (TEST-07). It keeps what it holds between runs.
  mirror:
    profiles: [tools]
    image: registry:3.1.2@sha256:01cd312e67026f06f5d89c3e133a4a9adc7cb9eeb9b1194e0b2954dfd770efd2
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
    volumes:
      - mirror:/var/lib/registry
    healthcheck: *registry-health

  crane:
    extends: { file: deploy/tools/compose.yaml, service: crane }
    profiles: [tools]
    volumes:
      - ./target/image:/image:ro
      - ./target/image-postgres:/image-postgres:ro

  grype:
    profiles: [tools]
    image: anchore/grype:v0.121.0@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea
    environment:
      GRYPE_DB_CACHE_DIR: /cache
    volumes:
      - ./target/image:/image:ro
      - ./target/image-postgres:/image-postgres:ro
      - grype:/cache

  cosign:
    extends: { file: deploy/tools/compose.yaml, service: cosign }
    profiles: [tools]

  # The server that the end-to-end tests deploy to: Docker in a container of its own, running the
  # reference deployment as a server's Docker would (TEST-04, OPS-16).
  server:
    profiles: [tools]
    image: docker:29.9.2-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977

  # The stand-in for the reference deployment's backup bucket, which the end-to-end tests run on
  # their server: SeaweedFS, which serves the S3 protocol (OPS-17).
  bucket:
    profiles: [tools]
    image: chrislusf/seaweedfs:4.50@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860

  # k6, which `just load-test` runs to measure one replica's capacity (OPS-18). It reaches the
  # collector, on the same network, to count the spans the collector accepted.
  k6:
    profiles: [tools]
    image: grafana/k6:2.3.0@sha256:2dd4756ec6e14e62778916e1eb850108e4b499304c02df56760fa0bdb0fba0b8

  # shellcheck, which `just check-shell` runs on the justfile's recipes and the deployment's
  # scripts (CODE-16).
  shellcheck:
    profiles: [tools]
    image: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

  # Installs QEMU, through which a Linux machine runs another platform's binaries, such as the
  # arm64 image's end-to-end tests on an amd64 machine.
  binfmt:
    profiles: [tools]
    image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
    privileged: true

  # BuildKit, which builds the image, and the generator of its software bill of materials (SBOM).
  # The image tasks pass their names to Docker's builder.
  buildkit:
    profiles: [tools]
    image: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

  sbom-generator:
    profiles: [tools]
    image: docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

volumes:
  postgres:
  grype:
  mirror:
  prometheus:
  alertmanager:
  loki:
  tempo:
  grafana:
